name: Sync upstream rulesets

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-rulesets
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Synchronize pinned upstreams
        run: python scripts/sync_upstreams.py

      - name: Validate all published artifacts
        run: python scripts/validate.py --require-upstreams

      - name: Commit changed artifacts
        shell: bash
        run: |
          git add rules/category-finance.mrs rules/category-cryptocurrency.mrs sources.lock.json
          if git diff --cached --quiet; then
            echo "Upstream artifacts are unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync upstream rulesets"
          git push

